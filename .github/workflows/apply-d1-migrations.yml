name: Apply D1 migrations

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply remote D1 migrations
        run: npx wrangler@4 d1 migrations apply kyoten --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify historical SaverStats rows
        run: >
          npx wrangler@4 d1 execute kyoten --remote --command
          "SELECT COUNT(*) AS snapshots,
          SUM(CASE WHEN total_players = -1 AND total_guilds = -1 THEN 1 ELSE 0 END) AS missing_totals
          FROM saver_stats_snapshots
          WHERE source_url = 'historical-excel';
          SELECT COUNT(*) AS classes,
          SUM(CASE WHEN c.player_count = 0 THEN 1 ELSE 0 END) AS zero_classes
          FROM saver_stats_classes c
          JOIN saver_stats_snapshots s ON s.id = c.snapshot_id
          WHERE s.source_url = 'historical-excel';"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
