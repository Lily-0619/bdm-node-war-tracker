name: Collect SaverStats

on:
  schedule:
    - cron: "20 16 * * *"
  workflow_dispatch:

concurrency:
  group: collect-saver-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-saver-stats.txt
      - run: pip install -r scripts/requirements-saver-stats.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/collect_saver_stats.py
        env:
          DBONK_USERNAME: ${{ secrets.DBONK_USERNAME }}
          DBONK_PASSWORD: ${{ secrets.DBONK_PASSWORD }}
          STATS_INGEST_URL: ${{ secrets.STATS_INGEST_URL }}
          STATS_INGEST_TOKEN: ${{ secrets.STATS_INGEST_TOKEN }}
