name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-kyoten-tax-board
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test SaverStats
        run: node tests/saver-stats.test.mjs
      - name: Check types
        run: npm run typecheck
      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
      - name: Deploy Worker
        run: npx wrangler deploy --keep-vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify SaverStats API
        run: |
          node --input-type=module <<'NODE'
          const base = "https://kyoten-tax-board.perceneige.workers.dev";
          for (let attempt = 0; attempt < 6; attempt++) {
            const response = await fetch(base + "/api/saver-stats");
            if (response.ok && response.headers.get("content-type")?.includes("application/json")) {
              const data = await response.json();
              if (Array.isArray(data.snapshots) && Array.isArray(data.classes)) {
                console.log("SaverStats OK:", data.snapshots.length, "snapshots,", data.classes.length, "class rows");
                process.exit(0);
              }
            }
            await new Promise(resolve => setTimeout(resolve, 10000));
          }
          throw new Error("SaverStats API did not return valid JSON after deployment");
          NODE
