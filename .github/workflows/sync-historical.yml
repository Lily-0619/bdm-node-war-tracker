name: Sync historical from D1

on:
  schedule:
    # 22:00 UTC = 07:00 JST（前日分の対戦結果が出揃った頃に反映）
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Sync data/historical from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/sync_historical_from_d1.py --query-and-run

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- data/historical; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/historical
          git commit -m "chore: D1の対戦結果をhistoricalへ自動反映"
          git push
